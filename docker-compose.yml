name: komintern

services:
  server:
    build:
      context: .
      dockerfile: server/Dockerfile
    image: komintern-server:latest
    restart: always
    environment:
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:-*}
      SOCKET_RATE_LIMIT_MAX_EVENTS: ${SOCKET_RATE_LIMIT_MAX_EVENTS:-80}
      SOCKET_RATE_LIMIT_WINDOW_MS: ${SOCKET_RATE_LIMIT_WINDOW_MS:-10000}
      AFK_TIMEOUT_MS: ${AFK_TIMEOUT_MS:-60000}
      EMPTY_ROOM_GRACE_MS: ${EMPTY_ROOM_GRACE_MS:-120000}
      MAX_ROOMS: ${MAX_ROOMS:-200}
      ENGINE_TIMEOUT_MS: ${ENGINE_TIMEOUT_MS:-5000}
      LOG_LEVEL: ${LOG_LEVEL:-info}
    expose:
      - "3000"
    networks:
      - komintern
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/socket.io/?EIO=4&transport=polling').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 15s
      timeout: 3s
      start_period: 10s
      retries: 3

  web:
    build:
      context: ./client
      args:
        VITE_SERVER_URL: ${VITE_SERVER_URL:-}
    image: komintern-web:latest
    restart: always
    ports:
      - "${WEB_PORT:-8080}:8080"
    depends_on:
      server:
        condition: service_healthy
    networks:
      - komintern
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:8080/ || exit 1"]
      interval: 15s
      timeout: 3s
      start_period: 5s
      retries: 3

  # Tunnel Cloudflare : connexion sortante uniquement, aucun port à ouvrir sur la box.
  # Activé par COMPOSE_PROFILES=tunnel et CLOUDFLARE_TUNNEL_TOKEN dans .env.
  # Dans Cloudflare, le hostname public doit pointer vers le service http://web:8080.
  cloudflared:
    image: cloudflare/cloudflared:latest
    profiles: ["tunnel"]
    restart: always
    command: tunnel --no-autoupdate run
    environment:
      TUNNEL_TOKEN: ${CLOUDFLARE_TUNNEL_TOKEN:?CLOUDFLARE_TUNNEL_TOKEN manquant dans .env}
    depends_on:
      web:
        condition: service_healthy
    networks:
      - komintern

# Aucun volume : l'état du jeu est en mémoire, rien n'est écrit sur disque.

networks:
  komintern:
    driver: bridge
