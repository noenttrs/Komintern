name: komintern

services:
  server:
    build:
      context: .
      dockerfile: server/Dockerfile
    image: komintern-server:latest
    restart: always
    environment:
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:-*}
      SOCKET_RATE_LIMIT_MAX_EVENTS: ${SOCKET_RATE_LIMIT_MAX_EVENTS:-80}
      SOCKET_RATE_LIMIT_WINDOW_MS: ${SOCKET_RATE_LIMIT_WINDOW_MS:-10000}
      AFK_TIMEOUT_MS: ${AFK_TIMEOUT_MS:-60000}
      EMPTY_ROOM_GRACE_MS: ${EMPTY_ROOM_GRACE_MS:-120000}
      MAX_ROOMS: ${MAX_ROOMS:-200}
      ENGINE_TIMEOUT_MS: ${ENGINE_TIMEOUT_MS:-5000}
      LOG_LEVEL: ${LOG_LEVEL:-info}
      PUBLIC_URL: ${PUBLIC_URL:-http://localhost:8080}
      MONGO_APP_URL: mongodb://app:${MONGO_APP_PASSWORD:?}@mongo:27017/nazicom?authSource=nazicom
      MONGO_LOG_URL: mongodb://logger:${MONGO_LOG_PASSWORD:?}@mongo:27017/nazicom_logs?authSource=nazicom_logs
      REDIS_URL: redis://:${REDIS_PASSWORD:?}@redis:6379/0
      RESEND_API_KEY: ${RESEND_API_KEY:-}
      EMAIL_FROM: ${EMAIL_FROM:-}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
      LEGAL_EDITOR_NAME: ${LEGAL_EDITOR_NAME:-}
      LEGAL_CONTACT_EMAIL: ${LEGAL_CONTACT_EMAIL:-}
      DONATION_URL: ${DONATION_URL:-}
      LOG_ANONYMIZE_AFTER_DAYS: ${LOG_ANONYMIZE_AFTER_DAYS:-365}
      SOCKET_REDIS_ADAPTER: ${SOCKET_REDIS_ADAPTER:-false}
    expose:
      - "3000"
    depends_on:
      mongo:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - komintern
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/socket.io/?EIO=4&transport=polling').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 15s
      timeout: 3s
      start_period: 10s
      retries: 3

  web:
    build:
      context: ./client
      args:
        VITE_SERVER_URL: ${VITE_SERVER_URL:-}
    image: komintern-web:latest
    restart: always
    ports:
      - "${WEB_PORT:-8080}:8080"
    depends_on:
      server:
        condition: service_healthy
    networks:
      - komintern
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:8080/ || exit 1"]
      interval: 15s
      timeout: 3s
      start_period: 5s
      retries: 3

  # Bases de données : aucun port publié, joignables uniquement depuis le réseau Docker.
  mongo:
    image: mongo:7
    restart: always
    environment:
      MONGO_INITDB_ROOT_USERNAME: root
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_ROOT_PASSWORD:?}
      MONGO_APP_PASSWORD: ${MONGO_APP_PASSWORD:?}
      MONGO_LOG_PASSWORD: ${MONGO_LOG_PASSWORD:?}
    volumes:
      - mongo-data:/data/db
      - ./infra/mongo-init.js:/docker-entrypoint-initdb.d/init.js:ro
    networks:
      - komintern
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 10s
      timeout: 5s
      start_period: 20s
      retries: 5

  redis:
    image: redis:7-alpine
    restart: always
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD:?}", "--appendonly", "yes"]
    volumes:
      - redis-data:/data
    networks:
      - komintern
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$$REDIS_PASSWORD\" --no-auth-warning ping | grep -q PONG"]
      interval: 10s
      timeout: 3s
      retries: 5
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?}

  # Tunnel Cloudflare : connexion sortante uniquement, aucun port à ouvrir sur la box.
  # Activé par COMPOSE_PROFILES=tunnel et CLOUDFLARE_TUNNEL_TOKEN dans .env.
  # Dans Cloudflare, le hostname public doit pointer vers le service http://web:8080.
  cloudflared:
    image: cloudflare/cloudflared:latest
    profiles: ["tunnel"]
    restart: always
    command: tunnel --no-autoupdate run
    environment:
      TUNNEL_TOKEN: ${CLOUDFLARE_TUNNEL_TOKEN:?CLOUDFLARE_TUNNEL_TOKEN manquant dans .env}
    depends_on:
      web:
        condition: service_healthy
    networks:
      - komintern

# Les parties en cours restent en mémoire ; comptes, amis, stats et logs sont dans Mongo.
volumes:
  mongo-data:
  redis-data:

networks:
  komintern:
    driver: bridge
