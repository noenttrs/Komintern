map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

# Journal d'accès minimal : ni adresse IP ni page d'origine (données personnelles inutiles ici),
# et sans les sondes de santé de Docker.
log_format komintern '[$time_local] "$request" $status $body_bytes_sent "$http_user_agent"';
map $http_user_agent $komintern_loggable {
    ~^Wget  0;
    default 1;
}

server {
    listen 8080;
    access_log /var/log/nginx/access.log komintern if=$komintern_loggable;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    server_tokens off;

    # DNS interne Docker : re-résout "server" pour suivre ses redémarrages (nouvelle IP)
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $komintern_server http://server:3000;

    gzip on;
    gzip_vary on;
    gzip_min_length 512;
    gzip_types text/css application/javascript application/json image/svg+xml;

    # En-têtes de sécurité (répétés dans chaque location qui ajoute ses propres en-têtes :
    # nginx n'hérite pas des add_header du niveau server dans ce cas).
    set $csp "default-src 'self'; script-src 'self'; style-src 'self'; font-src 'self'; img-src 'self' data:; connect-src 'self' wss://$host ws://$host; manifest-src 'self'; worker-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'";

    # Socket.IO (polling + WebSocket) vers le serveur Node
    location /socket.io/ {
        proxy_pass $komintern_server;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 1h;
        proxy_send_timeout 1h;
    }

    # API HTTP (comptes, amis) vers le serveur Node. CF-Connecting-IP (posé par Cloudflare, qui
    # écrase toute valeur envoyée par le client) est transmis tel quel ; X-Forwarded-For ne reprend
    # jamais la chaîne fournie par le client. Le port n'est publié que sur 127.0.0.1 (compose).
    location /api/ {
        proxy_pass $komintern_server;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        client_max_body_size 16k;
    }

    # Service worker et manifest : toujours revalidés, sinon les mises à jour n'arrivent pas.
    location ~ ^/(sw\.js|registerSW\.js|manifest\.webmanifest)$ {
        types {
            application/javascript js;
            application/manifest+json webmanifest;
        }
        add_header Cache-Control "no-cache" always;
        add_header X-Content-Type-Options "nosniff" always;
        try_files $uri =404;
    }

    # Assets Vite hashés : cache long
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Strict-Transport-Security "max-age=31536000" always;
        try_files $uri =404;
    }

    # Pages de l'application (liens d'invitation, comptes, administration) : servies par
    # l'application, jamais indexées par les moteurs de recherche.
    location ~ ^/(r/[A-Za-z0-9_-]+|profil(/[A-Za-z0-9_-]+)?|amis|connexion|admin|moderation)/?$ {
        include /etc/nginx/komintern-headers.conf;
        add_header X-Robots-Tag "noindex, nofollow" always;
        try_files /index.html =404;
    }

    # Accueil, pages publiques prérendues (scripts/prerender.mjs : /regles → /regles/index.html)
    # et fichiers statiques ; toute autre adresse répond une vraie 404.
    location / {
        include /etc/nginx/komintern-headers.conf;
        try_files $uri $uri/index.html =404;
    }

    location = /404.html {
        include /etc/nginx/komintern-headers.conf;
        internal;
    }
    error_page 404 /404.html;
}
